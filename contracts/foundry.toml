[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.38"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "../vectors" }]

# forge has no 0x100 P-256 precompile before osaka, so tests run on osaka. Deploy with FOUNDRY_PROFILE=deploy.
[profile.deploy]
evm_version = "prague"

[rpc_endpoints]
whitechain = "https://rpc.testnet.whitechain.io/"
