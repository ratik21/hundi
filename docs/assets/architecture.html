<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hundi architecture</title>
<style>
  :root { --ink:#333; --paper:#fff; --soft:#777; }
  * { margin:0; }
  html,body { background:var(--paper); }
  svg { display:block; font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif; fill:var(--ink); }
  .n { font-size:25px; font-weight:600; text-anchor:middle; }
  .s { font-size:19px; fill:var(--soft); text-anchor:middle; }
  .l { font-size:20px; fill:var(--soft); text-anchor:middle; }
  .box { fill:var(--paper); stroke:#999; stroke-width:2; }
  .line { fill:none; stroke:#777; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .dash { stroke-dasharray:2 9; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372">
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <path class="line dash" d="M170 88V30H1030V82" marker-end="url(#a)"/>
  <rect x="520" y="18" width="160" height="26" fill="var(--paper)"/>
  <text class="l" x="600" y="38">or directly</text>

  <rect class="box" x="20" y="92" width="300" height="104" rx="14"/>
  <text class="n" x="170" y="136">Phone</text>
  <text class="s" x="170" y="168">works with no network</text>

  <path class="line" d="M324 144H452" marker-end="url(#a)"/>
  <text class="l" x="386" y="130">Claim</text>

  <rect class="box" x="460" y="92" width="280" height="104" rx="14"/>
  <text class="n" x="600" y="136">Relayer</text>
  <text class="s" x="600" y="168">optional, pays gas</text>

  <path class="line" d="M744 144H872" marker-end="url(#a)"/>

  <rect class="box" x="880" y="92" width="300" height="104" rx="14"/>
  <text class="n" x="1030" y="136">HundiVault</text>
  <text class="s" x="1030" y="168">holds USDT and deposits</text>

  <path class="line" d="M600 200V252" marker-end="url(#a)"/>
  <rect class="box" x="460" y="262" width="280" height="92" rx="14"/>
  <text class="n" x="600" y="302">Uniswap v3</text>
  <text class="s" x="600" y="332">buys the relayer's gas</text>
</svg>
</body>
</html>
